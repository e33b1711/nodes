; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
extra_scripts = 
	pre:auto_firmware_version.py
	ota_upload.py

[mega_base]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
; Optiboot instead of the stock stk500v2 bootloader, needed for OTA (see README)
upload_protocol = arduino
upload_speed = 115200
; OTA keeps the new firmware in the upper half of the flash until it is copied
board_upload.maximum_size = 130560
board_bootloader.file = bootloader/optiboot_atmega2560.hex
board_bootloader.lfuse = 0xFF
board_bootloader.hfuse = 0xD6
board_bootloader.efuse = 0xFD
board_bootloader.lock_bits = 0x0F
board_bootloader.unlock_bits = 0x3F
lib_deps = 
   jandrassy/ArduinoOTA@1.1.1
   arduino-libraries/Ethernet@^2.0.2
   knolleary/PubSubClient@^2.8
   paulstoffregen/OneWire@2.3.8
   milesburton/DallasTemperature@4.0.6
   https://github.com/dvarrel/DHT22.git#1.0.7
   https://github.com/monkeyboard/Wiegand-Protocol-Library-for-Arduino.git#v1.0.20
build_src_filter = +<${PIOENV}.cpp>
; node_lib reads include/secret_ota.h
build_flags = -I include

[env:og_ost]
extends = mega_base
custom_ota_host =

[env:og_west]
extends = mega_base
custom_ota_host =

[env:eg_ost]
extends = mega_base
custom_ota_host =

[env:eg_west]
extends = mega_base
custom_ota_host =

[env:ug]
extends = mega_base
custom_ota_host =

[env:test]
extends = mega_base
custom_ota_host =

[env:garage]
extends = mega_base
custom_ota_host =

; burns Optiboot and the fuses with an ISP programmer, see README:
;   pio run -e bootloader -t bootloader
; -t bootloader does not pass the port and speed to avrdude, upload_flags does
[env:bootloader]
extends = mega_base
build_src_filter = +<test.cpp>
; Arduino Uno with the ArduinoISP sketch, check the port with: pio device list
; another port: pio run -e bootloader -t bootloader --upload-port /dev/ttyACM1
upload_protocol = stk500v1
upload_port = /dev/ttyACM0
upload_flags =
   -P$UPLOAD_PORT
   -b19200
; USBasp instead, slow SPI clock in case the chip does not run at 16 MHz yet:
; upload_protocol = usbasp
; upload_flags = -B8
